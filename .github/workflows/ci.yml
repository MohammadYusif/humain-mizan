# Fresh-clone check: everything a judge would run, on a clean machine, on every push.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install (locked)
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (no API calls; real-contract texts and Tesseract are optional)
        run: uv run pytest -q
      - name: Licence check (no copyleft)
        run: uv run python scripts/check_licenses.py
      - name: Proof results load from the curated files
        run: uv run python -c "from hack.workflow import eval_results; from hack.config import Settings; r = eval_results(Settings()); print(len(r), 'proof entries'); assert r"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t mizan .
      - name: Smoke test with sign-in required (as a deployment runs)
        run: |
          H=$(docker run --rm mizan python -c "from hack.auth import hash_password; print(hash_password('ci-smoke-password'))")
          docker run -d --name mizan-smoke -p 9000:9000 -e PORT=9000 -e HACK_REQUIRE_AUTH=true -e HACK_SECRET_KEY=ci \
            -e "HACK_AUTH_USERS=ci:$H" -e HACK_RUNS_DIR=/app/data/runs mizan
          for i in $(seq 1 40); do curl -sf localhost:9000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9000/runs)" = 401
          curl -sf -c c.txt -X POST localhost:9000/auth/login -H 'content-type: application/json' \
            -d '{"username":"ci","password":"ci-smoke-password"}'
          test "$(curl -s -b c.txt -o /dev/null -w '%{http_code}' localhost:9000/runs)" = 200
          docker exec mizan-smoke tesseract --list-langs | grep -q ara
          curl -sf -b c.txt localhost:9000/demo/scenes | grep -q escalate-injection
