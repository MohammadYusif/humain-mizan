[project]
name = "hack"
version = "0.1.0"
description = "HUMAIN Future AI Builders Hackathon starter: agent loop, tracing, evals, API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-docx>=1.2.0",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
# Any OpenAI-compatible endpoint: vLLM, Ollama, llama.cpp server, HUMAIN-hosted models.
openai = ["openai>=3.41.0"]

[project.scripts]
hack = "hack.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long prompt strings are fine

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
